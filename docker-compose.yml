services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sih26162
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih26162"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sih:sih@db:5432/sih26162
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      FIRMS_SOURCE: ${FIRMS_SOURCE:-VIIRS_SNPP_NRT}
      FIRMS_AREA: ${FIRMS_AREA:-world}
      FIRMS_DAYS: ${FIRMS_DAYS:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgis_data:
